<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | Limón Studios</title><script src="https://cdn.tailwindcss.com"></script><script src="api-config.js"></script><style>body{background:#020617;color:#e2e8f0}</style></head><body class="min-h-screen grid place-items-center p-4"><main class="w-full max-w-lg rounded-3xl border border-slate-800 bg-slate-900 p-7"><a href="index.html" class="text-yellow-400">← Limón Studios</a><h1 class="mt-4 text-3xl font-bold">Tu cuenta</h1><p class="mt-2 text-slate-400">Accede para gestionar tus pedidos.</p><div class="mt-6 grid grid-cols-2 gap-2"><button id="tab-login" class="rounded-xl bg-yellow-400 p-3 font-bold text-slate-950">Iniciar sesión</button><button id="tab-register" class="rounded-xl bg-slate-800 p-3">Crear cuenta</button></div><form id="auth-form" class="mt-5 space-y-3"><div id="name-fields" class="hidden grid-cols-2 gap-3"><input id="firstName" placeholder="Nombre" class="w-full rounded-xl border border-slate-700 bg-slate-950 p-3"><input id="lastName" placeholder="Apellido" class="w-full rounded-xl border border-slate-700 bg-slate-950 p-3"></div><input id="email" type="email" required placeholder="Correo electrónico" class="w-full rounded-xl border border-slate-700 bg-slate-950 p-3"><input id="password" type="password" required minlength="10" placeholder="Contraseña (mínimo 10 caracteres)" class="w-full rounded-xl border border-slate-700 bg-slate-950 p-3"><div id="verify-fields" class="hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="Código de verificación de 6 dígitos" class="w-full rounded-xl border border-slate-700 bg-slate-950 p-3"></div><button id="submit-btn" class="w-full rounded-xl bg-yellow-400 p-3 font-bold text-slate-950">Iniciar sesión</button><p id="message" role="status" class="text-sm"></p></form><button id="google-btn" class="mt-3 w-full rounded-xl border border-slate-700 p-3">Continuar con Google</button><button id="verify-btn" class="mt-3 hidden w-full text-sm text-yellow-400 underline">Ya tengo mi código: verificar correo</button><p class="mt-5 text-xs text-slate-500">Al continuar aceptas los <a href="politicas.html" class="underline">términos y políticas</a>.</p></main><script>
const API=window.LIMON_API_BASE;let mode='login',pendingVerify=false;const $=id=>document.getElementById(id);function setMode(m){mode=m;$('name-fields').classList.toggle('hidden',m!=='register');$('name-fields').classList.toggle('grid',m==='register');$('submit-btn').textContent=m==='login'?'Iniciar sesión':pendingVerify?'Verificar correo':'Crear cuenta';$('tab-login').className='rounded-xl p-3 '+(m==='login'?'bg-yellow-400 text-slate-950 font-bold':'bg-slate-800');$('tab-register').className='rounded-xl p-3 '+(m==='register'?'bg-yellow-400 text-slate-950 font-bold':'bg-slate-800');$('password').classList.toggle('hidden',pendingVerify);$('password').required=!pendingVerify;$('verify-fields').classList.toggle('hidden',!pendingVerify);$('verify-btn').classList.toggle('hidden',m!=='register'||pendingVerify);}
$('tab-login').onclick=()=>{pendingVerify=false;setMode('login')};$('tab-register').onclick=()=>setMode('register');$('verify-btn').onclick=()=>{pendingVerify=true;setMode('register')};$('google-btn').onclick=()=>location.href=API+'/auth/google';$('auth-form').onsubmit=async e=>{e.preventDefault();$('message').textContent='Procesando…';try{let path,body;if(mode==='login'){path='/auth/login';body={email:$('email').value,password:$('password').value};}else if(pendingVerify){path='/auth/verify-email';body={email:$('email').value,code:$('code').value};}else{path='/auth/register';body={firstName:$('firstName').value,lastName:$('lastName').value,email:$('email').value,password:$('password').value};}const r=await fetch(API+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo completar.');$('message').textContent=d.message||'Listo';if(path==='/auth/register'){pendingVerify=true;setMode('register');}else if(path==='/auth/login'){location.href=new URLSearchParams(location.search).get('next')==='checkout'?'index.html':'dashboard.html';}else if(path==='/auth/verify-email'){pendingVerify=false;setMode('login');}}catch(err){$('message').textContent=err.message;}};
if(new URLSearchParams(location.search).get('error'))$('message').textContent='No se pudo iniciar sesión con Google. Comprueba que el correo esté disponible y OAuth configurado.';setMode('login');
</script></body></html>
